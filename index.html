<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Milk Diary</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <img src="assets/cow-logo.png" alt="Cow Logo" class="logo"/>
    <h1>Milk Diary</h1>

    <div class="form">
      <label for="milkInput">คุณดื่มนมวันนี้กี่ ml?</label>
      <input type="number" id="milkInput" placeholder="เช่น 250"/>
      <button onclick="saveEntry()">บันทึก</button>
    </div>

    <h2>ย้อนหลัง 7 วัน</h2>
    <table id="historyTable">
      <thead>
        <tr>
          <th>วันที่</th>
          <th>ปริมาณ (ml)</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <audio id="mooSound" src="assets/moo.mp3" preload="auto"></audio>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
